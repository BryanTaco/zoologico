version: 0.2

env:
  parameter-store:
    INSTANCE_ID: /zoologico/iis-instance-id
    BUCKET_NAME: /zoologico/deployment-bucket

phases:

  install:
    runtime-versions:
      python: 3.11
    commands:
      - aws --version

  pre_build:
    commands:
      - echo "=== PIPELINE CI/CD - ZOOLOGICO NACIONAL ==="
      - echo "Commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - aws sts get-caller-identity

  build:
    commands:
      - echo "=== PASO 1 - Sincronizando archivos con S3 ==="
      - aws s3 sync . s3://$BUCKET_NAME/zoologico/ --delete --exclude "buildspec.yml" --exclude ".git/*"
      - echo "Archivos subidos a S3 exitosamente"

      - echo "=== PASO 2 - Generando parametros SSM con Python ==="
      - |
        python3 << PYEOF
        import json, os
        bucket = os.environ['BUCKET_NAME']
        params = {
            "commands": [
                "Import-Module WebAdministration",
                "Stop-WebSite -Name 'Default Web Site'",
                "Remove-Item -Path 'C:/inetpub/wwwroot/*' -Recurse -Force -ErrorAction SilentlyContinue",
                "'C:/Program Files/Amazon/AWSCLIV2/aws.exe' s3 sync s3://" + bucket + "/zoologico/ C:/inetpub/wwwroot/ --delete",
                "Start-WebSite -Name 'Default Web Site'",
                "Write-Host 'Despliegue completado exitosamente'"
            ]
        }
        with open('/tmp/ssm-commands.json', 'w') as f:
            json.dump(params, f)
        print("JSON generado correctamente")
        PYEOF

      - echo "=== PASO 3 - Enviando comando al servidor IIS ==="
      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunPowerShellScript" \
          --comment "Deploy Zoologico" \
          --timeout-seconds 300 \
          --parameters file:///tmp/ssm-commands.json \
          --query "Command.CommandId" \
          --output text)
        echo "Comando SSM enviado ID $COMMAND_ID"

      - echo "=== PASO 4 - Esperando respuesta del servidor ==="
      - |
        ATTEMPTS=0
        STATUS="Pending"
        while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ]; do
          sleep 10
          ATTEMPTS=$((ATTEMPTS + 1))
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
          echo "Intento $ATTEMPTS - Estado $STATUS"
          if [ $ATTEMPTS -ge 30 ]; then
            echo "TIMEOUT esperando al servidor"
            exit 1
          fi
        done
        if [ "$STATUS" = "Success" ]; then
          echo "=== DESPLIEGUE EXITOSO ==="
        else
          echo "=== ERROR EN DESPLIEGUE Estado $STATUS ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          exit 1
        fi

  post_build:
    commands:
      - echo "=== PIPELINE FINALIZADO ==="

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - buildspec.yml
    - .git/**
